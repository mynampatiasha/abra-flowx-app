# =============================================================================
#  Abra FlowX — iPhone build on Codemagic (cloud Mac) → TestFlight / App Store
#  Start a build in Codemagic: app "abra-flowx" → workflow "Abra FlowX iOS".
#  The only thing to change: ABRA_ASC_KEY below = the NAME of your App Store
#  Connect API key in Codemagic (Team settings → Integrations → Developer Portal).
# =============================================================================
workflows:
  abra-flowx-ios:
    name: Abra FlowX iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ABRA_ASC_KEY          # <-- change to your key's name in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: in.abragroup.flowx
      vars:
        APP_STORE_APPLE_ID: 6824482453
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm packages
        script: npm ci
      - name: Copy app settings into the iPhone project
        script: |
          npx cap copy ios
          # iPhone opens the same CRM start page, marked as the iOS app
          sed -i '' 's/entity-select.php?source=android/entity-select.php?source=ios/' ios/App/App/capacitor.config.json
          grep -n '"url"' ios/App/App/capacitor.config.json
      - name: Install CocoaPods (Capacitor + Firebase)
        script: cd ios/App && pod install --repo-update
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Build the app (.ipa) with the next build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$(( ${LATEST:-0} + 1 ))
          echo "Build number: $NEXT"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$NEXT"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
